<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-Powered Job Portal</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; }
      .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
      nav { background: #007bff; padding: 1rem; }
      nav ul { display: flex; list-style: none; gap: 20px; align-items: center; }
      nav a, nav button { color: white; text-decoration: none; padding: 0.5rem 1rem; border: none; background: transparent; cursor: pointer; font-size: 1rem; }
      nav button:hover, nav a:hover { background: rgba(255,255,255,0.1); }
      .hero { text-align: center; padding: 3rem 0; background: #f8f9fa; }
      .jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 2rem 0; }
      .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1.5rem; }
      .card h3 { margin-bottom: 0.5rem; color: #007bff; }
      .btn { background: #007bff; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
      .btn:hover { background: #0056b3; }
      .form-group { margin-bottom: 1rem; }
      .form-group label { display: block; margin-bottom: 0.5rem; }
      .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
